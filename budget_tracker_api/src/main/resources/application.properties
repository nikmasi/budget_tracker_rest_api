spring.application.name=budget_tracker_api

# mysql connection setttings
spring.datasource.url=jdbc:mysql://localhost:3306/budget_tracker?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# jpa hibernate config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# not allow convert int to string
spring.jackson.deserialization.accept-single-value-as-array=false

